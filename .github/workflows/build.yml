name: build

# Catches build errors before Railway sees them. Mirrors the Dockerfile's
# build step: same Node version, same NEXT_PUBLIC_* arg shape, same working
# directory. If this job goes red, do not merge / push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js production)
        env:
          # postinstall runs `prisma generate`; that only needs a parseable URL.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # NEXT_PUBLIC_* values get baked into the client bundle. Use placeholders
          # so the build resolves; real values are only needed at runtime.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: paypal_placeholder
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: cloudinary_placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used
          NEXTAUTH_URL: https://example.com
        run: npm run build
