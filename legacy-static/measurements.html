<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWULA_K - Measurements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button class="back-btn">←</button>
        <h1>Measurements</h1>
        <button class="check-btn">✓</button>
    </header>
    <main>
        <section class="measurement-visual">
            <img src="placeholder.jpg" alt="Measurement visual">
            <p>Saved profile • Bridal / Event</p>
        </section>
        <section class="measurements">
            <div>
                <label>Bust</label>
                <input type="text" value="36 in">
            </div>
            <div>
                <label>Waist</label>
                <input type="text" value="29 in">
            </div>
            <div>
                <label>Hip</label>
                <input type="text" value="41 in">
            </div>
            <div>
                <label>Shoulder</label>
                <input type="text" value="15 in">
            </div>
        </section>
        <section class="history">
            <h3>Saved profile</h3>
            <p>Alteration history</p>
            <p>Fit confidence</p>
            <p>Reuse across orders</p>
        </section>
    </main>
    <nav class="bottom-nav">
        <a href="index.html">Home</a>
        <a href="orders.html">Orders</a>
        <a href="consults.html">Consults</a>
        <a href="profile.html" class="active">Profile</a>
    </nav>
</body>
</html>
